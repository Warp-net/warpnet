services:
  warpnet11:
    container_name: warpnet-testnet-1
    image: ghcr.io/warp-net/warpnet-relay:latest
    network_mode: host
    restart: unless-stopped
    mem_limit: 192m
    mem_reservation: 96m
    oom_score_adj: 200
    environment:
      - NODE_PORT=4011
      - NODE_HOST_V4=207.154.221.44
      - NODE_NETWORK=testnet
      - LOGGING_LEVEL=info
      - LOGGING_FORMAT=json
      - NODE_SEED=warpnet1 # deterministic seed for 3 bootstrap nodes
      - NODE_METRICS_GATEWAY=207.154.221.44:4091
      - GOMEMLIMIT=144MiB

  warpnet22:
    container_name: warpnet-testnet-2
    image: ghcr.io/warp-net/warpnet-relay:latest
    network_mode: host
    restart: unless-stopped
    mem_limit: 192m
    mem_reservation: 96m
    oom_score_adj: 200
    environment:
      - NODE_PORT=4022
      - NODE_HOST_V4=207.154.221.44
      - NODE_NETWORK=testnet
      - LOGGING_LEVEL=info
      - LOGGING_FORMAT=json
      - NODE_SEED=warpnet2 # deterministic seed for 3 bootstrap nodes
      - NODE_METRICS_GATEWAY=207.154.221.44:4091
      - GOMEMLIMIT=144MiB

  warpnet33:
    container_name: warpnet-testnet-3
    image: ghcr.io/warp-net/warpnet-relay:latest
    network_mode: host
    restart: unless-stopped
    mem_limit: 192m
    mem_reservation: 96m
    oom_score_adj: 200
    environment:
      - NODE_PORT=4033
      - NODE_HOST_V4=207.154.221.44
      - NODE_NETWORK=testnet
      - LOGGING_LEVEL=info
      - LOGGING_FORMAT=json
      - NODE_SEED=warpnet3 # deterministic seed for 3 bootstrap nodes
      - NODE_METRICS_GATEWAY=207.154.221.44:4091
      - GOMEMLIMIT=144MiB

