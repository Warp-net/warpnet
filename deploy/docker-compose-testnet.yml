  vadim-testnet:
    container_name: vadim-testnet
    image: ghcr.io/warp-net/warpnet-vadim:latest
    network_mode: host
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    oom_score_adj: 500
    environment:
      - NODE_PORT=4055
      - NODE_HOST_V4=207.154.221.44
      - NODE_NETWORK=testnet
      - LOGGING_LEVEL=info
      - LOGGING_FORMAT=json
      - NODE_SERVER_PORT=4999
      - NODE_METRICS_GATEWAY=207.154.221.44:4091
      - GOMEMLIMIT=384MiB
    volumes:
      - /root/.warpdata-vadim:/root/.warpdata:rw

  push-gateway:
    container_name: push-gateway-testnet
    image: prom/pushgateway:latest
    network_mode: host
    command:
      - "--web.listen-address=:4091"
    restart: unless-stopped
    mem_limit: 64m
    mem_reservation: 24m
    oom_score_adj: 800

  echo:
    container_name: echo-testnet
    image: ghcr.io/warp-net/warpnet-echo:latest
    network_mode: host
    restart: unless-stopped
    mem_limit: 384m
    mem_reservation: 96m
    oom_score_adj: 700
    environment:
      - NODE_PORT=4066
      - NODE_HOST_V4=207.154.221.44
      - NODE_NETWORK=testnet
      - LOGGING_LEVEL=info
      - LOGGING_FORMAT=json
      - NODE_SEED=echo-testnet
      - GOMEMLIMIT=288MiB
    volumes:
      - ${HOME}/warpnet-data/testnet/echo:/root/.warpdata/testnet/storage
