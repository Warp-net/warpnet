services:
  remote-node-testnet:
    container_name: remote-node-testnet
    build:
      context: .
      dockerfile: Dockerfile.remote
    network_mode: host
    environment:
      - NODE_PORT=4001
      - NODE_NETWORK=testnet
      - LOGGING_LEVEL=info
      - LOGGING_FORMAT=json
      - NODE_SERVER_PORT=4999
