name: Release / Warpfone

# Builds an existing tag and uploads it to TestFlight. The workflow never bumps
# versions, never commits and never pushes tags: the version comes from
# warpfone/Version.xcconfig at that tag. It runs only by hand, apart from the
# Release workflow, so releases that don't touch warpfone don't reach TestFlight.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Git tag to build (e.g., v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  testflight:
    name: TestFlight
    # App Store Connect wants the iOS 27 SDK; macos-26 ships only Xcode 26.
    runs-on: xcode-27
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Warpnet.xcframework
        run: warpfone/scripts/build-xcframework.sh

      - name: Run tests
        run: |
          swift test --package-path warpfone/Packages/WarpnetTransport
          swift test --package-path warpfone/Packages/Network

      - name: Install the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"

      # Automatic signing archives with a development profile, which Apple
      # issues only to teams with registered devices, so the archive is signed
      # manually with a stored distribution certificate and an App Store profile
      # that sigh fetches, or creates, through the App Store Connect key.
      - name: Install the distribution certificate and profile
        env:
          FASTLANE_OPT_OUT_USAGE: "YES"
          FASTLANE_SKIP_UPDATE_CHECK: "YES"
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          command -v fastlane > /dev/null || brew install fastlane
          python3 -c 'import json, os, sys; json.dump({"key_id": os.environ["ASC_KEY_ID"], "issuer_id": os.environ["ASC_ISSUER_ID"], "key": open(sys.argv[1]).read(), "in_house": False}, open(sys.argv[2], "w"))' \
            "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" "$RUNNER_TEMP/asc/api_key.json"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" \
                   "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          profile="$RUNNER_TEMP/PROFILE_APP.mobileprovision"
          fastlane run get_provisioning_profile \
            app_identifier:site.warpnet.warpfone \
            api_key_path:"$RUNNER_TEMP/asc/api_key.json" \
            output_path:"$RUNNER_TEMP" \
            filename:PROFILE_APP.mobileprovision \
            skip_install:true
          security cms -D -i "$profile" > "$profile.plist"
          uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile.plist")"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          cp "$profile" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.mobileprovision"
          echo "PROFILE_APP_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile.plist")" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          xcodebuild archive \
            -project warpfone/WarpnetApp.xcodeproj \
            -scheme WarpnetApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/warpfone.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN" \
            'PROVISIONING_PROFILE_SPECIFIER=$(WARPFONE_PROFILE_$(TARGET_NAME))' \
            WARPFONE_PROFILE_WarpnetApp="$PROFILE_APP_NAME"

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>site.warpnet.warpfone</key>
              <string>$PROFILE_APP_NAME</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/warpfone.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP"/PROFILE_*
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
