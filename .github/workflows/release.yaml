name: Release

# The pipeline never bumps versions, never commits and never pushes tags.
# The maintainer bumps the `version` file, creates the tag and pushes it;
# this workflow only builds that tag and attaches artifacts to the Release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Git tag to release (e.g., v1.0.0)"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event.inputs.tag }}
  CGO_ENABLED: "1"

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
          - os: macos-latest
            platform: darwin/universal
          - os: windows-latest
            platform: windows/amd64

    runs-on: ${{ matrix.os }}
    permissions:
      packages: write
      contents: write
      pull-requests: write
      repository-projects: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Linux deps
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          sudo apt update
          sudo apt install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Build Moderator (Linux AMD64)
        if: ${{ startsWith(matrix.os, 'ubuntu') && matrix.platform == 'linux/amd64' }}
        # Taken out of Dockerfile.moderator: llama links glibc, libstdc++ and
        # libgomp dynamically, so the released moderator must be built in the
        # image it replaces itself in.
        run: |
          git submodule update --init core/moderation
          docker build -f Dockerfile.moderator -t warpnet-moderator-release .
          id=$(docker create warpnet-moderator-release)
          docker cp "$id:/warpnet/warpnet" moderator
          docker rm "$id"

      - name: Build (Wails, Linux with compression)
        working-directory: cmd/node/member
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: wails build -clean -platform ${{ matrix.platform }} -tags webkit2_41 -m -nosyncgomod -upx -upxflags="-7"

      - name: Build Relay (Linux with compression)
        working-directory: cmd/node/relay
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        # Static, like Dockerfile.relay: the released relay is what self-update
        # installs, and a dynamically linked binary cannot run in distroless.
        env:
          CGO_ENABLED: "0"
        run: go build -ldflags "-s -w" -gcflags=all=-l -mod=vendor -o relay

      - name: Build (Wails)
        working-directory: cmd/node/member
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        run: wails build -clean -platform ${{ matrix.platform }} -tags webkit2_41 -m -nosyncgomod

      - name: Package + checksum (Linux AMD64)
        if: ${{ startsWith(matrix.os, 'ubuntu') && matrix.platform == 'linux/amd64' }}
        run: |
          mkdir -p out/linux_amd64
          mv cmd/node/member/build/bin/* out/linux_amd64/warpnet
          tar -C out/linux_amd64 -czf warpnet_linux_amd64.tar.gz .
          shasum -a 256 warpnet_linux_amd64.tar.gz > warpnet_linux_amd64_checksums.txt

      - name: Package Relay + checksum (Linux AMD64)
        if: ${{ startsWith(matrix.os, 'ubuntu') && matrix.platform == 'linux/amd64' }}
        run: |
          mkdir -p out/relay_linux_amd64
          mv cmd/node/relay/relay out/relay_linux_amd64/relay
          tar -C out/relay_linux_amd64 -czf relay_linux_amd64.tar.gz .
          shasum -a 256 relay_linux_amd64.tar.gz > relay_linux_amd64_checksums.txt

      - name: Package Moderator + checksum (Linux AMD64)
        if: ${{ startsWith(matrix.os, 'ubuntu') && matrix.platform == 'linux/amd64' }}
        run: |
          mkdir -p out/moderator_linux_amd64
          mv moderator out/moderator_linux_amd64/moderator
          tar -C out/moderator_linux_amd64 -czf moderator_linux_amd64.tar.gz .
          shasum -a 256 moderator_linux_amd64.tar.gz > moderator_linux_amd64_checksums.txt

      - name: Package + checksum (Linux ARM64)
        if: ${{ startsWith(matrix.os, 'ubuntu') && matrix.platform == 'linux/arm64' }}
        run: |
          mkdir -p out/linux_arm64
          mv cmd/node/member/build/bin/* out/linux_arm64/warpnet
          tar -C out/linux_arm64 -czf warpnet_linux_arm64.tar.gz .
          shasum -a 256 warpnet_linux_arm64.tar.gz > warpnet_linux_arm64_checksums.txt

      - name: Package + checksum (macOS)
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          mkdir -p out/darwin
          mv cmd/node/member/build/bin/* out/darwin/warpnet.app
          tar -C out/darwin -czf warpnet_darwin.tar.gz .
          shasum -a 256 warpnet_darwin.tar.gz > warpnet_darwin_checksums.txt

      - name: Package + checksum (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out\windows_amd64 | Out-Null
          Move-Item cmd\node\member\build\bin\* out\windows_amd64\warpnet.exe
          Compress-Archive -Path out\windows_amd64\* -DestinationPath "warpnet_windows_amd64.zip" -Force
          (Get-FileHash "warpnet_windows_amd64.zip" -Algorithm SHA256).Hash + "  warpnet_windows_amd64.zip" | Out-File -Encoding ASCII "warpnet_windows_amd64_checksums.txt"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            relay_linux_amd64.tar.gz
            relay_linux_amd64_checksums.txt
            moderator_linux_amd64.tar.gz
            moderator_linux_amd64_checksums.txt
            warpnet_linux_amd64.tar.gz
            warpnet_linux_amd64_checksums.txt
            warpnet_linux_arm64.tar.gz
            warpnet_linux_arm64_checksums.txt
            warpnet_darwin.tar.gz
            warpnet_darwin_checksums.txt
            warpnet_windows_amd64.zip
            warpnet_windows_amd64_checksums.txt


  sign:
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Sign the checksum listings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "::error::RELEASE_SIGNING_KEY is not set: the release would ship unsigned" >&2
            echo "Generate it with: openssl genpkey -algorithm ed25519 -out release.key" >&2
            exit 1
          fi

          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > release.key
          trap 'rm -f release.key release.pub' EXIT
          openssl pkey -in release.key -pubout -out release.pub

          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*_checksums.txt' --dir sums

          for listing in sums/*_checksums.txt; do
            openssl pkeyutl -sign -inkey release.key -rawin -in "$listing" | base64 -w0 > "$listing.sig"

            base64 -d "$listing.sig" > "$listing.raw"
            openssl pkeyutl -verify -pubin -inkey release.pub -rawin \
              -in "$listing" -sigfile "$listing.raw"
            rm -f "$listing.raw"

            echo "signed $(basename "$listing")"
          done

          gh release upload "$RELEASE_TAG" sums/*.sig --repo "$GITHUB_REPOSITORY" --clobber


  mirror-codeberg:
    needs: [release, sign]
    runs-on: ubuntu-latest

    steps:
      - name: Mirror the release to Codeberg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CODEBERG_REPO: Warpnet/warpnet
        run: |
          set -euo pipefail

          if [ -z "${CODEBERG_TOKEN:-}" ]; then
            echo "::warning::CODEBERG_TOKEN is not set, the release stays on GitHub only"
            exit 0
          fi

          api="https://codeberg.org/api/v1/repos/$CODEBERG_REPO"
          auth="Authorization: token $CODEBERG_TOKEN"

          for asset in relay_linux_amd64.tar.gz \
                       moderator_linux_amd64.tar.gz \
                       warpnet_linux_amd64.tar.gz \
                       warpnet_linux_arm64.tar.gz \
                       warpnet_windows_amd64.zip; do
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" --dir assets
          done
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*_checksums.txt*' --dir assets

          id=$(curl -sf -H "$auth" "$api/releases/tags/$RELEASE_TAG" | jq -r '.id // empty' || true)
          if [ -z "$id" ]; then
            id=$(curl -sf -X POST -H "$auth" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$RELEASE_TAG\",\"name\":\"$RELEASE_TAG\"}" \
              "$api/releases" | jq -r '.id')
          fi
          test -n "$id"

          for file in assets/*; do
            name=$(basename "$file")
            curl -sf -X POST -H "$auth" \
              -F "attachment=@$file" \
              "$api/releases/$id/assets?name=$name" > /dev/null
            echo "mirrored $name"
          done

          published=$(curl -sf "$api/releases/latest" | jq -r .tag_name)
          if [ "$published" != "$RELEASE_TAG" ]; then
            echo "::error::Codeberg still serves $published as the latest release" >&2
            exit 1
          fi
          echo "Codeberg now serves $published"
