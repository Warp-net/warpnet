name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to bump"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

env:
  GO_VERSION: "1.26.0"
  CGO_ENABLED: "1"

jobs:
  # Single source of versioning (moved out of the git hooks). Bumps the version,
  # syncs the derived files, commits the bump to main, tags v<version> and pushes
  # the tag to GitHub + the Codeberg mirror. The build jobs below check out this
  # tag, so the version //go:embed-ed into the binary matches the release.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          # A PAT (RELEASE_PAT) is used when set so the bump commit can land on a
          # protected main; otherwise the default token is used.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Bump version and sync derived files
        id: bump
        env:
          BUMP: ${{ github.event.inputs.bump }}
        run: |
          set -euo pipefail

          FILE="version"
          SNAPCRAFT="snap/snapcraft.yaml"
          [ -f "$FILE" ] || { echo "Version file not found!"; exit 1; }
          [ -f "$SNAPCRAFT" ] || { echo "Snapcraft file not found: $SNAPCRAFT"; exit 1; }

          CURRENT_VERSION=$(grep -Eo '^[0-9]+\.[0-9]+\.[0-9]+' "$FILE")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          case "${BUMP:-patch}" in
            major) MAJOR=$((10#$MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((10#$MINOR + 1)); PATCH=0 ;;
            patch|"") PATCH=$((10#$PATCH + 1)) ;;
            *) echo "Unknown bump: $BUMP"; exit 1 ;;
          esac
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "CURRENT_VERSION=$CURRENT_VERSION -> NEW_VERSION=$NEW_VERSION"

          # version file (//go:embed-ed into the binary) and the snapcraft version field.
          sed -i "s/^$CURRENT_VERSION\$/$NEW_VERSION/" "$FILE"
          sed -i -E "s/^version:[[:space:]]*'?([0-9]+\.[0-9]+\.[0-9]+)'?/version: ${NEW_VERSION}/" "$SNAPCRAFT"

          # CODE FREEZE: warpdroid is under F-Droid inclusion review — keep
          # warpdroid/fdroid/versionCode and the fastlane changelogs frozen so
          # checkupdates never sees a new warpdroid version at new tags.
          # # F-Droid versionCode: base = (major*1000000 + minor*10000 + patch) * 10
          # # (single APK, no ABI offset).
          # NEW_BASE=$(( (10#$MAJOR * 1000000 + 10#$MINOR * 10000 + 10#$PATCH) * 10 ))
          #
          # # Keep the fastlane changelog named <versionCode>.txt: carry the most
          # # recent note forward to the new name and drop any others.
          # CHANGELOGS="fastlane/metadata/android/en-US/changelogs"
          # if [ -d "$CHANGELOGS" ]; then
          #   NEW="$CHANGELOGS/$NEW_BASE.txt"
          #   LATEST=$(ls "$CHANGELOGS"/*.txt 2>/dev/null | sort -V | tail -1)
          #   if [ -n "$LATEST" ] && [ "$LATEST" != "$NEW" ]; then
          #     mv -f "$LATEST" "$NEW"
          #     echo "Changelog: $(basename "$LATEST") -> $(basename "$NEW")"
          #   fi
          #   find "$CHANGELOGS" -maxdepth 1 -name '*.txt' ! -name "$NEW_BASE.txt" -exec rm -f {} +
          # fi
          #
          # # Publish the F-Droid versionCode so fdroiddata's UpdateCheckMode: Tags
          # # can read warpdroid/fdroid/versionCode at the tag.
          # FDROID_VERSIONCODE="warpdroid/fdroid/versionCode"
          # if [ -f "$FDROID_VERSIONCODE" ]; then
          #   echo "$NEW_BASE" > "$FDROID_VERSIONCODE"
          # fi

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit bump, tag and push to origin
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."; exit 1
          fi

          # CODE FREEZE (F-Droid review): warpdroid versionCode/changelogs are not bumped.
          # git add version snap/snapcraft.yaml warpdroid/fdroid/versionCode
          # git add -A fastlane/metadata/android/en-US/changelogs
          git add version snap/snapcraft.yaml

          # [skip ci] keeps the push-to-main workflows from re-running on the bump.
          git commit -m "chore(release): $TAG [skip ci]"
          git tag -a "$TAG" -m "Release version $VERSION"
          git push origin HEAD:main
          git push origin "$TAG"

      - name: Mirror tag to Codeberg (best-effort)
        env:
          CODEBERG_SSH_KEY: ${{ secrets.CODEBERG_SSH_KEY }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -uo pipefail
          if [ -z "${CODEBERG_SSH_KEY:-}" ]; then
            echo "CODEBERG_SSH_KEY secret not set; skipping Codeberg mirror."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$CODEBERG_SSH_KEY" > ~/.ssh/codeberg
          chmod 600 ~/.ssh/codeberg
          ssh-keyscan -t rsa,ecdsa,ed25519 codeberg.org >> ~/.ssh/known_hosts 2>/dev/null || true
          # Bounded like the old pre-push hook so a slow Codeberg can never hang the run.
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/codeberg -o IdentitiesOnly=yes" \
            timeout --kill-after=5 30 git push ssh://git@codeberg.org/Warpnet/warpnet.git "$TAG" \
            || echo "warn: pushing $TAG to Codeberg failed or timed out (continuing)"

  release:
    needs: version
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
          - os: macos-latest
            platform: darwin/universal
          - os: windows-latest
            platform: windows/amd64

    runs-on: ${{ matrix.os }}
    permissions:
      packages: write
      contents: write
      pull-requests: write
      repository-projects: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Linux deps
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          sudo apt update
          sudo apt install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Build (Wails, Linux with compression)
        working-directory: cmd/node/member
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: wails build -clean -platform ${{ matrix.platform }} -tags webkit2_41 -m -nosyncgomod -upx -upxflags="--best"

      - name: Build Relay (Linux with compression)
        working-directory: cmd/node/relay
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: go build -ldflags "-s -w" -gcflags=all=-l -mod=vendor -o relay

      - name: Build (Wails)
        working-directory: cmd/node/member
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        run: wails build -clean -platform ${{ matrix.platform }} -tags webkit2_41 -m -nosyncgomod

      - name: Package + checksum (Linux AMD64)
        if: ${{ startsWith(matrix.os, 'ubuntu') && matrix.platform == 'linux/amd64' }}
        run: |
          mkdir -p out/linux_amd64
          mv cmd/node/member/build/bin/* out/linux_amd64/warpnet
          tar -C out/linux_amd64 -czf warpnet_linux_amd64.tar.gz .
          shasum -a 256 warpnet_linux_amd64.tar.gz > warpnet_linux_amd64_checksums.txt

      - name: Package Relay + checksum (Linux AMD64)
        if: ${{ startsWith(matrix.os, 'ubuntu') && matrix.platform == 'linux/amd64' }}
        run: |
          mkdir -p out/relay_linux_amd64
          mv cmd/node/relay/relay out/relay_linux_amd64/relay
          tar -C out/relay_linux_amd64 -czf relay_linux_amd64.tar.gz .
          shasum -a 256 relay_linux_amd64.tar.gz > relay_linux_amd64_checksums.txt

      - name: Package + checksum (Linux ARM64)
        if: ${{ startsWith(matrix.os, 'ubuntu') && matrix.platform == 'linux/arm64' }}
        run: |
          mkdir -p out/linux_arm64
          mv cmd/node/member/build/bin/* out/linux_arm64/warpnet
          tar -C out/linux_arm64 -czf warpnet_linux_arm64.tar.gz .
          shasum -a 256 warpnet_linux_arm64.tar.gz > warpnet_linux_arm64_checksums.txt

      - name: Package + checksum (macOS)
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          mkdir -p out/darwin
          mv cmd/node/member/build/bin/* out/darwin/warpnet
          tar -C out/darwin -czf warpnet_darwin.tar.gz .
          shasum -a 256 warpnet_darwin.tar.gz > warpnet_darwin_checksums.txt

      - name: Package + checksum (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out\windows_amd64 | Out-Null
          Move-Item cmd\node\member\build\bin\* out\windows_amd64\warpnet.exe
          Compress-Archive -Path out\windows_amd64\* -DestinationPath "warpnet_windows_amd64.zip" -Force
          (Get-FileHash "warpnet_windows_amd64.zip" -Algorithm SHA256).Hash + "  warpnet_windows_amd64.zip" | Out-File -Encoding ASCII "warpnet_windows_amd64_checksums.txt"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            relay_linux_amd64.tar.gz
            relay_linux_amd64_checksums.txt
            warpnet_linux_amd64.tar.gz
            warpnet_linux_amd64_checksums.txt
            warpnet_linux_arm64.tar.gz
            warpnet_linux_arm64_checksums.txt
            warpnet_darwin.tar.gz
            warpnet_darwin_checksums.txt
            warpnet_windows_amd64.zip
            warpnet_windows_amd64_checksums.txt

