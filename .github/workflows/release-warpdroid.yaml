name: Release warpdroid

# Builds the warpdroid APK for a warpdroid-vX.Y.Z tag and attaches it to that
# tag's Release. The tag is the Android version: versionName X.Y.Z, versionCode
# derived from it by warpdroid/app/build.gradle. F-Droid watches the same tags,
# so only these releases reach the store. The pipeline never commits and never
# pushes tags.
on:
  push:
    tags:
      - "warpdroid-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing warpdroid tag to release (e.g., warpdroid-v0.8.130)"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true

      - name: Derive version from the tag
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^warpdroid-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::tag must be warpdroid-vMAJOR.MINOR.PATCH, got $RELEASE_TAG" >&2
            exit 1
          fi
          echo "WARPDROID_VERSION=${RELEASE_TAG#warpdroid-v}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: warpdroid

      - name: Pre-fetch Gradle distribution
        run: |
          set -euo pipefail
          cache_dir="$HOME/.gradle/wrapper/dists/gradle-9.0.0-bin/d6wjpkvcgsg3oed0qlfss3wgl"
          mkdir -p "$cache_dir"
          if [ -s "$cache_dir/gradle-9.0.0-bin.zip" ]; then
            echo "Gradle distribution already cached at $cache_dir."
            exit 0
          fi
          curl --fail --location --show-error \
            --retry 8 --retry-all-errors --retry-delay 15 \
            --connect-timeout 30 --max-time 300 \
            -o "$cache_dir/gradle-9.0.0-bin.zip" \
            https://services.gradle.org/distributions/gradle-9.0.0-bin.zip

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install NDK r27c (match F-Droid recipe)
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          # `yes | sdkmanager` breaks under pipefail (SIGPIPE when sdkmanager
          # closes stdin). Accept licenses in a guarded step, then install without
          # a pipe. Licenses are usually pre-accepted on the runner anyway.
          "$SDKMANAGER" --licenses >/dev/null 2>&1 <<< "$(printf 'y\n%.0s' {1..50})" || true
          "$SDKMANAGER" "ndk;27.2.12479018"
          test -d "$NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Build Warpnet native library (gomobile) at F-Droid's build path
        run: |
          set -euo pipefail
          FDROID_DIR=/home/vagrant/build/site.warpnet.warpdroid
          sudo mkdir -p /home/vagrant/build
          sudo cp -a "$GITHUB_WORKSPACE" "$FDROID_DIR"
          sudo chown -R "$(id -un):$(id -gn)" /home/vagrant/build
          (cd "$FDROID_DIR" && go mod download)
          (cd "$FDROID_DIR/warpdroid/node" && bash build-native.sh)
          libs="$GITHUB_WORKSPACE/warpdroid/warpnet-transport/libs"
          mkdir -p "$libs"
          cp "$FDROID_DIR/warpdroid/warpnet-transport/libs/warpnet.aar" "$libs/warpnet.aar"
          cp "$FDROID_DIR/warpdroid/warpnet-transport/libs/warpnet-sources.jar" "$libs/warpnet-sources.jar"

      - name: Decode release keystore (if configured)
        id: keystore
        env:
          WARPDROID_KEYSTORE_BASE64: ${{ secrets.WARPDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$WARPDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/warpdroid.keystore"
          echo "path=$RUNNER_TEMP/warpdroid.keystore" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        working-directory: warpdroid
        env:
          WARPDROID_KEYSTORE: ${{ steps.keystore.outputs.path }}
          WARPDROID_KEYSTORE_PASSWORD: ${{ secrets.WARPDROID_KEYSTORE_PASSWORD }}
          WARPDROID_KEY_ALIAS: ${{ secrets.WARPDROID_KEY_ALIAS }}
          WARPDROID_KEY_PASSWORD: ${{ secrets.WARPDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PwarpdroidVersion="$WARPDROID_VERSION" --stacktrace

      - name: Locate APK + checksum
        working-directory: warpdroid
        run: |
          set -euo pipefail
          # Single arm64-v8a APK (no ABI split); ship it as the release artifact.
          src=$(find app/build/outputs/apk/release -name 'Warpdroid_*_release.apk' -type f | head -1)
          if [ -z "$src" ]; then
            echo "FATAL: no release APK produced" >&2
            ls -la app/build/outputs/apk/release/ >&2 || true
            exit 1
          fi
          dst=warpdroid.apk
          cp "$src" "$dst"
          shasum -a 256 "$dst" > "warpdroid_checksums.txt"

      - name: Verify APK signature
        working-directory: warpdroid
        env:
          EXPECTED_SHA256: "eabdd61e5bcbd6615a3f54977c06646c0f5422d845d37c818286b7d34285dfec"
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --min-sdk-version 24 warpdroid.apk
          GOT=$("$APKSIGNER" verify --print-certs warpdroid.apk \
            | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          if [ "$GOT" != "$EXPECTED_SHA256" ]; then
            echo "::error::APK signed by wrong key. got=$GOT want=$EXPECTED_SHA256" >&2
            exit 1
          fi
          echo "OK: signed by expected key."

      - name: Sign the checksum listing
        working-directory: warpdroid
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "::error::RELEASE_SIGNING_KEY is not set: the release would ship unsigned" >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release.key"
          trap 'rm -f "$RUNNER_TEMP/release.key"' EXIT
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/release.key" -rawin \
            -in warpdroid_checksums.txt | base64 -w0 > warpdroid_checksums.txt.sig

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # selfupdate of the desktop node reads releases/latest; an APK-only
          # release must never become it.
          make_latest: false
          files: |
            warpdroid/warpdroid.apk
            warpdroid/warpdroid_checksums.txt
            warpdroid/warpdroid_checksums.txt.sig
