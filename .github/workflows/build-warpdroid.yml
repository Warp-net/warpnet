name: Tests / Build Warpdroid

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warpdroid
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: warpdroid


      - name: Pre-fetch Gradle distribution
        run: |
          set -euo pipefail
          cache_dir="$HOME/.gradle/wrapper/dists/gradle-9.0.0-bin/d6wjpkvcgsg3oed0qlfss3wgl"
          mkdir -p "$cache_dir"
          if [ -s "$cache_dir/gradle-9.0.0-bin.zip" ]; then
            echo "Gradle distribution already cached at $cache_dir."
            exit 0
          fi
          curl --fail --location --show-error \
            --retry 8 --retry-all-errors --retry-delay 15 \
            --connect-timeout 30 --max-time 300 \
            -o "$cache_dir/gradle-9.0.0-bin.zip" \
            https://services.gradle.org/distributions/gradle-9.0.0-bin.zip

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Warpnet native library (gomobile)
        working-directory: warpdroid/node
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          (cd "$GITHUB_WORKSPACE" && go mod download)
          bash build-native.sh

      - name: Build debug
        id: build
        run: |
          set -o pipefail
          ./gradlew build -x test -x lint -x lintAnalyzeDebug -x lintReportDebug --stacktrace 2>&1 | tee assemble.log

      - name: Assemble debug APK
        id: assemble
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee assemble.log

      - name: Post build failure as PR comment
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tail = (p, bytes = 60000) => {
              if (!fs.existsSync(p)) return `(no ${p} produced)`;
              const stat = fs.statSync(p);
              const start = Math.max(0, stat.size - bytes);
              const fd = fs.openSync(p, 'r');
              const buf = Buffer.alloc(stat.size - start);
              fs.readSync(fd, buf, 0, buf.length, start);
              fs.closeSync(fd);
              return buf.toString('utf8');
            };
            const logPath = path.join('warpdroid', 'assemble.log');
            const assembleLog = tail(logPath);
            const body = [
              `## CI build failure (\`${context.sha.substring(0, 7)}\`)`,
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '<details><summary><code>:app:assembleDebug</code> (last 60 KB)</summary>',
              '',
              '```',
              assembleLog,
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
