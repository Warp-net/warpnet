      <path d="M32 5 H15 L5 15 V32" stroke-width="3"/>
      <path d="M32 10.5 H17 L10.5 17 V32" stroke-width="1.5" opacity="0.55"/>
      <path d="M10 2.5 L17.5 10 L10 17.5 L2.5 10 Z" fill="#8a6f38" stroke="none"/>
      <path d="M10 5.8 L14.2 10 L10 14.2 L5.8 10 Z" fill="#efe7d3" stroke="none"/>
    </g>
    <g id="e" fill="none" stroke="#8a6f38">
      <path d="M32 5 H64" stroke-width="3"/>
      <path d="M32 10.5 H64" stroke-width="1.5" opacity="0.55"/>
      <circle cx="48" cy="7.5" r="2.6" fill="#8a6f38" stroke="none"/>
      <circle cx="48" cy="7.5" r="1.2" fill="#efe7d3" stroke="none"/>
    </g>
  </defs>
  <use href="#c"/>
