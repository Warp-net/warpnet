<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Original artwork for the Warpnet grimdark theme (AGPLv3, same as the
       project). 9-slice border-image: slice at 32 of 96. Brass double line,
       chamfered corners with a diamond stud, riveted edges. -->
  <defs>
    <g id="c" fill="none" stroke="#a58a4a">
      <path d="M32 5 H15 L5 15 V32" stroke-width="3"/>
      <path d="M32 10.5 H17 L10.5 17 V32" stroke-width="1.5" opacity="0.55"/>
      <path d="M10 2.5 L17.5 10 L10 17.5 L2.5 10 Z" fill="#a58a4a" stroke="none"/>
      <path d="M10 5.8 L14.2 10 L10 14.2 L5.8 10 Z" fill="#14110e" stroke="none"/>
    </g>
    <g id="e" fill="none" stroke="#a58a4a">
      <path d="M32 5 H64" stroke-width="3"/>
      <path d="M32 10.5 H64" stroke-width="1.5" opacity="0.55"/>
      <circle cx="48" cy="7.5" r="2.6" fill="#a58a4a" stroke="none"/>
      <circle cx="48" cy="7.5" r="1.2" fill="#14110e" stroke="none"/>
    </g>
  </defs>
  <use href="#c"/>
  <use href="#c" transform="matrix(-1 0 0 1 96 0)"/>
  <use href="#c" transform="matrix(1 0 0 -1 0 96)"/>
  <use href="#c" transform="matrix(-1 0 0 -1 96 96)"/>
  <use href="#e"/>
  <use href="#e" transform="rotate(90 48 48)"/>
  <use href="#e" transform="rotate(180 48 48)"/>
  <use href="#e" transform="rotate(270 48 48)"/>
</svg>
